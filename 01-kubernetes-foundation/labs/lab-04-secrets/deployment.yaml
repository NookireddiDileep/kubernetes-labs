apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      containers:
      - name: nginx
        image: nginx:latest

        env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username

        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
