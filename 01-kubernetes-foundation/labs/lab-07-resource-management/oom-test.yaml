apiVersion: v1
kind: Pod
metadata:
  name: oom-test
spec:
  restartPolicy: Always
  containers:
  - name: memory-hog
    image: polinux/stress
    command:
      - stress
    args:
      - "--vm"
      - "1"
      - "--vm-bytes"
      - "300M"
      - "--vm-hang"
      - "1"

    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"

      limits:
        memory: "128Mi"
        cpu: "500m"
