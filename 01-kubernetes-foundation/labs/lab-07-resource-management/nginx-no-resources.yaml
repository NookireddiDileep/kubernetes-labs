apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-no-resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-no-resources
  template:
    metadata:
      labels:
        app: nginx-no-resources
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
