apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
  - name: stress
    image: polinux/stress
    command:
      - stress
    args:
      - "--vm"
      - "1"
      - "--vm-bytes"
      - "128M"
      - "--vm-hang"
      - "1"
    resources:
      requests:
        memory: "128Mi"
      limits:
        memory: "256Mi"
