apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario07-pv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario07-pv-demo

  template:
    metadata:
      labels:
        app: scenario07-pv-demo

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        volumeMounts:
        - name: web-storage
          mountPath: /usr/share/nginx/html

      volumes:
      - name: web-storage
        persistentVolumeClaim:
          claimName: pv-troubleshoot-pvc
