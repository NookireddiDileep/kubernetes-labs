apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hello
        image: busybox:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Hello from Kubernetes Job"
          date
          sleep 10
          echo "Job Completed Successfully"
