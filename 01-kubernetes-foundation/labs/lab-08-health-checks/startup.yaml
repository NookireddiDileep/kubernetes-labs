apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-startup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-startup
  template:
    metadata:
      labels:
        app: nginx-startup
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
